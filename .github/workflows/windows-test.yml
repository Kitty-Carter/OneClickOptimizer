name: Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -File | Where-Object Extension -in '.ps1','.psm1' | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: List module catalog
        shell: powershell
        run: powershell.exe -NoProfile -File .\OneClickOptimizer.ps1 -Mode list
      - name: Test Positron in isolated fixtures
        shell: powershell
        run: powershell.exe -NoProfile -File .\tests\Test-Positron.ps1
      - name: Build exact-commit single BAT
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'oco-clash-single'
          python .github/scripts/build-clash-release.py --ref $env:GITHUB_SHA --output $out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bat = Join-Path $out 'Clash-OneClick-Config.bat'
          & $bat --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check shared public payload and AI rules
        shell: powershell
        run: |
          python modules/clash-verge-rev/tests/test-share.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
