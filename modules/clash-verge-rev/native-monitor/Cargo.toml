[package]
name = "oco-clash-monitor"
version = "0.3.0-alpha.2"
edition = "2021"
license = "MIT"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation","Win32_NetworkManagement_IpHelper","Win32_NetworkManagement_Ndis","Win32_System_SystemInformation","Win32_System_Threading","Win32_System_Diagnostics_ToolHelp","Win32_System_ProcessStatus","Win32_System_Performance","Win32_System_Power","Win32_System_LibraryLoader","Win32_UI_WindowsAndMessaging","Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
