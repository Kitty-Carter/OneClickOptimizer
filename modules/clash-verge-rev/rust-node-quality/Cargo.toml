[package]
name = "oco-node-quality"
version = "1.1.0-alpha.1"
edition = "2021"
license = "MIT"

[target.'cfg(windows)'.dependencies]
serde_yaml_ng = "=0.10.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation","Win32_Security","Win32_Security_Cryptography","Win32_System_JobObjects","Win32_System_Threading","Win32_NetworkManagement_IpHelper"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
